name: Tarball Smoke Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    name: Validate clean tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build bundles
        run: bun run build

      - name: Check TypeScript
        run: bun run typecheck

      - name: Run regression tests
        run: bun test

      - name: Smoke test the packed tarball
        run: npm run test
